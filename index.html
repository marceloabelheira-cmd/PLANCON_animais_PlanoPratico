<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLANCON Animais — Defesa Civil RJ</title>
<style>
  :root{
    /* Cores fixas de marca — não mudam entre tema claro/escuro (faixa institucional, selos numerados) */
    --brand-navy-1:#0b2545;
    --brand-navy-2:#16406f;

    --blue-900:#0b2545;
    --blue-800:#0f2f57;
    --blue-700:#16406f;
    --blue-600:#1c5490;
    --blue-100:#e8eff8;
    --orange-600:#d9530a;
    --orange-500:#f2760c;
    --orange-100:#fdece0;
    --gray-50:#f7f8fa;
    --gray-100:#eef0f3;
    --gray-200:#e1e5eb;
    --gray-400:#9aa4b2;
    --gray-600:#5b6572;
    --gray-800:#2b323c;
    --white:#ffffff;
    --surface:#ffffff;
    --lvl0:#4c7a5e;
    --lvl0-bg:#e7f1eb;
    --lvl1:#b8860a;
    --lvl1-bg:#fbf1d9;
    --lvl2:#d9530a;
    --lvl2-bg:#fdece0;
    --lvl3:#b8271f;
    --lvl3-bg:#faeae9;
    --radius:14px;
    --shadow: 0 1px 2px rgba(11,37,69,.06), 0 6px 20px rgba(11,37,69,.08);
    --shadow-hover: 0 2px 4px rgba(11,37,69,.08), 0 12px 28px rgba(11,37,69,.14);
  }

  :root[data-theme="dark"]{
    --blue-900:#dce6f6;
    --blue-800:#c7d9f0;
    --blue-700:#8fb8e6;
    --blue-600:#6fa8dc;
    --blue-100:#152238;
    --orange-600:#ff9257;
    --orange-500:#f2760c;
    --orange-100:#2e1c10;
    --gray-50:#0a1220;
    --gray-100:#1a2540;
    --gray-200:#2a3752;
    --gray-400:#64748b;
    --gray-600:#a3b0c2;
    --gray-800:#e8ecf3;
    --surface:#121b2e;
    --lvl0:#7fc79a;
    --lvl0-bg:#132a1e;
    --lvl1:#e6c065;
    --lvl1-bg:#2b2412;
    --lvl2:#ff9257;
    --lvl2-bg:#2e1c10;
    --lvl3:#f2867c;
    --lvl3-bg:#2c1615;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
    --shadow-hover: 0 2px 6px rgba(0,0,0,.55), 0 16px 32px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  svg{ fill:none; stroke:currentColor; }
  html{ color-scheme: light; }
  html[data-theme="dark"]{ color-scheme: dark; }
  body{
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--gray-50);
    color: var(--gray-800);
    min-height:100vh;
    overflow-x: hidden;
    transition: background-color .2s ease, color .2s ease;
  }
  .topbar{
    background: linear-gradient(135deg, var(--brand-navy-1), var(--brand-navy-2));
    color: var(--white);
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    row-gap:10px;
    gap:16px;
    position: sticky;
    top:0;
    z-index: 20;
    box-shadow: 0 2px 10px rgba(11,37,69,.25);
  }
  .topbar-left{ display:flex; align-items:center; gap:16px; min-width:0; }
  .topbar .sedec-logo{
    height:52px; width:auto; display:block; flex-shrink:0;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.3));
  }
  .topbar-text .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color: #ffd9b8; opacity:.95; font-weight:600;
  }
  .topbar-text h1{
    font-size:16px; margin:2px 0 0; font-weight:700; letter-spacing:.01em;
  }
  .topbar-note{
    font-size:10px; line-height:1.35; font-weight:400;
    color: rgba(255,255,255,.5); margin-top:4px; max-width:520px;
  }

  .topbar-right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .gov-id{
    display:flex; align-items:center; gap:7px;
    color: rgba(255,255,255,.85); font-size:11.5px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase; white-space:nowrap;
  }
  .gov-id .full{ font-weight:500; color: rgba(255,255,255,.55); }
  .committee-chip{
    background: var(--white); border-radius:10px; padding:4px 10px;
    display:flex; align-items:center; flex-shrink:0;
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  .committee-chip .committee-logo{ height:22px; width:auto; display:block; }
  .divider{ width:1px; height:22px; background: rgba(255,255,255,.25); flex-shrink:0; }

  .theme-toggle{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
    color: var(--white); cursor:pointer; padding:0;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{ background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.5); }
  .theme-toggle svg{ width:15px;height:15px; stroke:currentColor; }
  .breadcrumb{
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 24px 0;
    font-size:13px;
    color: var(--gray-600);
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
  }
  .breadcrumb .crumb{cursor:pointer; color:var(--blue-600);}
  .breadcrumb .crumb:hover{text-decoration:underline;}
  .breadcrumb .crumb.current{color:var(--gray-800); font-weight:600; cursor:default;}
  .breadcrumb .crumb.current:hover{text-decoration:none;}
  .breadcrumb .sep{color:var(--gray-400);}

  .backbar{
    max-width: 980px;
    margin: 10px auto 0;
    padding: 0 24px;
  }
  /* Na tela inicial não há para onde voltar nem trilha a mostrar — some com a faixa para não sobrar espaço vazio. */
  body.at-home .breadcrumb, body.at-home .backbar{ display:none; }
  .backbtn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--surface);
    border: 1px solid var(--gray-200);
    color: var(--blue-700);
    font-weight:600;
    font-size:13.5px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: all .15s ease;
  }
  .backbtn:hover{ background: var(--blue-100); border-color:var(--blue-600); }
  .backbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;}
  .backbtn:disabled{opacity:0; pointer-events:none;}

  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 18px 24px 64px;
  }
  .screen{ display:none; animation: fadein .25s ease; }
  .screen.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .hero{
    text-align:center;
    padding: 18px 10px 4px;
    position: relative;
  }
  .hero::before{
    content:"";
    position:absolute; top:0; left:50%;
    width:100vw; transform: translateX(-50%);
    height:150px;
    background:
      radial-gradient(ellipse 42% 100% at 22% 35%, rgba(242,118,12,.16), transparent 75%),
      radial-gradient(ellipse 42% 100% at 78% 35%, rgba(28,84,144,.18), transparent 75%),
      linear-gradient(90deg, rgba(28,84,144,.05), rgba(242,118,12,.05));
    pointer-events:none; z-index:0;
  }
  .hero > *{ position:relative; z-index:1; }
  .hero .seal{
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--surface); border:1px solid var(--gray-200); border-radius:16px;
    padding:12px 26px; margin: 0 0 14px; box-shadow: var(--shadow);
  }
  .hero .seal img{ height:46px; width:auto; display:block; }
  .hero-accent{
    width:56px; height:4px; border-radius:4px; margin:0 auto 10px;
    background: linear-gradient(90deg, var(--orange-500), var(--brand-navy-2));
  }
  .hero-eyebrow{
    font-size:12.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color: var(--gray-600); margin: 0 0 8px;
  }
  .hero h2{
    font-size: 27px; color: var(--blue-900); margin: 0 0 8px; font-weight:800;
    letter-spacing:-0.01em;
  }
  .hero p.sub{
    color: var(--gray-600); font-size:15px; max-width:700px; margin: 0 auto;
    line-height:1.55;
  }

  .section-title{
    font-size: 20px; color: var(--blue-900); font-weight:800; margin: 4px 0 4px;
  }
  .section-desc{ color: var(--gray-600); font-size:14.5px; line-height:1.6; margin: 0 0 22px; }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
    gap:16px; margin-top: 18px;
  }
  .grid.tight{ grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); }

  .card{
    background: var(--surface);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 20px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:10px;
    text-align:left;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--blue-600); }
  .card .icon{
    width:42px;height:42px;border-radius:11px;
    background: var(--blue-100); color: var(--blue-700);
    display:flex; align-items:center; justify-content:center;
  }
  .card .icon svg{width:22px;height:22px;stroke:currentColor;fill:none;}
  .card.orange .icon{ background: var(--orange-100); color: var(--orange-600); }
  .card h3{ margin:0; font-size:15.5px; color:var(--blue-900); font-weight:700; line-height:1.35; }
  .card p{ margin:0; font-size:13px; color:var(--gray-600); line-height:1.5; }
  .card .go{
    margin-top:auto; display:flex; align-items:center; gap:5px;
    color: var(--blue-600); font-size:12.5px; font-weight:700;
  }
  .card .go svg{width:12px;height:12px;stroke:currentColor;fill:none;}

  .card.disabled{ cursor:default; }
  .card.disabled:hover{ transform:none; box-shadow:var(--shadow); border-color:var(--gray-200); }
  .card.disabled .icon{ background: var(--gray-100); color: var(--gray-400); }
  .card.disabled h3{ color: var(--gray-600); }
  .badge-soon{
    margin-top:auto; display:inline-flex; align-items:center; width:fit-content;
    background: var(--gray-100); color: var(--gray-600);
    font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px;
  }
  .badge-soon.inline{ margin-top:0; flex-shrink:0; }

  .lawlist, .anexolist{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .lawitem, .anexoitem{
    display:flex; gap:13px; align-items:flex-start;
    background: var(--surface); border:1px solid var(--gray-200); border-radius:12px;
    padding:14px 16px; box-shadow: var(--shadow);
  }
  .lawitem .num, .anexoitem .num{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background: var(--blue-100); color: var(--blue-700);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:11.5px;
  }
  .lawitem p, .anexoitem p{ margin:0; font-size:14px; line-height:1.55; color:var(--gray-800); }
  .lawitem strong{ color:var(--blue-900); }
  .anexoitem{ align-items:center; }
  .anexoitem .anexo-title{ flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--blue-900); }

  .home-card{ padding:26px 20px; }
  .home-card .icon{ width:52px;height:52px;border-radius:13px; }
  .home-card .icon svg{width:26px;height:26px;}
  .home-card h3{ font-size:16.5px; }

  .macro-divider{
    display:flex; align-items:center; gap:14px;
    margin: 30px 0 16px; color: var(--gray-400);
    font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  }
  .macro-divider::before, .macro-divider::after{
    content:""; flex:1; height:1px; background: var(--gray-200);
  }
  .macro-link{
    display:flex; align-items:center; gap:16px;
    background: var(--gray-100); border: 1px dashed var(--gray-200);
    border-radius: var(--radius); padding: 16px 20px;
    cursor:pointer; transition: border-color .15s ease, background-color .15s ease;
  }
  .macro-link:hover{ border-color: var(--blue-600); background: var(--blue-100); }
  .macro-link .icon{
    width:42px;height:42px;border-radius:11px; flex-shrink:0;
    background: var(--surface); color: var(--blue-700);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .macro-link .icon svg{width:22px;height:22px;stroke:currentColor;fill:none;}
  .macro-link .macro-text{ flex:1; min-width:0; }
  .macro-link h3{ margin:0 0 2px; font-size:15px; color:var(--blue-900); font-weight:700; }
  .macro-link p{ margin:0; font-size:12.5px; color:var(--gray-600); line-height:1.45; }
  .macro-link .go{
    flex-shrink:0; display:flex; align-items:center; gap:5px;
    color: var(--blue-600); font-size:12.5px; font-weight:700;
  }
  .macro-link .go svg{width:12px;height:12px;stroke:currentColor;fill:none;}
  @media (max-width:640px){
    .macro-link{ flex-wrap:wrap; }
    .macro-link .go{ margin-left:58px; }
  }

  /* level badge cards */
  .lvl-card{ border-left: 6px solid var(--gray-400); }
  .lvl-card[data-lvl="0"]{ border-left-color: var(--lvl0); }
  .lvl-card[data-lvl="1"]{ border-left-color: var(--lvl1); }
  .lvl-card[data-lvl="2"]{ border-left-color: var(--lvl2); }
  .lvl-card[data-lvl="3"]{ border-left-color: var(--lvl3); }
  .lvl-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:800; letter-spacing:.04em;
    padding:4px 10px; border-radius:999px; width:fit-content;
  }
  .lvl-pill[data-lvl="0"]{ background:var(--lvl0-bg); color:var(--lvl0); }
  .lvl-pill[data-lvl="1"]{ background:var(--lvl1-bg); color:var(--lvl1); }
  .lvl-pill[data-lvl="2"]{ background:var(--lvl2-bg); color:var(--lvl2); }
  .lvl-pill[data-lvl="3"]{ background:var(--lvl3-bg); color:var(--lvl3); }

  .lvl-banner{
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom:22px;
    display:flex; flex-direction:column; gap:8px;
  }
  .lvl-banner[data-lvl="0"]{ background:var(--lvl0-bg); }
  .lvl-banner[data-lvl="1"]{ background:var(--lvl1-bg); }
  .lvl-banner[data-lvl="2"]{ background:var(--lvl2-bg); }
  .lvl-banner[data-lvl="3"]{ background:var(--lvl3-bg); }
  .lvl-banner h3{ margin:0; font-size:17px; font-weight:800; }
  .lvl-banner[data-lvl="0"] h3{ color:var(--lvl0); }
  .lvl-banner[data-lvl="1"] h3{ color:var(--lvl1); }
  .lvl-banner[data-lvl="2"] h3{ color:var(--lvl2); }
  .lvl-banner[data-lvl="3"] h3{ color:var(--lvl3); }
  .lvl-banner p{ margin:0; font-size:14px; color:var(--gray-800); line-height:1.55; }

  .panel{
    background: var(--surface);
    border:1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .panel h4{
    margin: 0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.06em;
    color: var(--blue-700); font-weight:800;
  }
  .panel p{ font-size:14.5px; line-height:1.65; color: var(--gray-800); margin:0 0 10px; }
  ul.bullets{ margin:0; padding-left: 20px; }
  ul.bullets li{ font-size:14.5px; line-height:1.65; color: var(--gray-800); margin-bottom:8px; }
  ul.bullets li::marker{ color: var(--orange-600); }
  ol.steps{ margin:0; padding-left: 22px; }
  ol.steps li{ font-size:14.5px; line-height:1.65; color: var(--gray-800); margin-bottom:10px; }
  ol.steps li::marker{ color: var(--blue-600); font-weight:700; }

  .flow{
    display:flex; flex-direction:column; gap:0;
  }
  .flow-step{
    display:flex; align-items:flex-start; gap:14px;
  }
  .flow-num{
    width:30px;height:30px;border-radius:50%;
    background: var(--brand-navy-2); color:white; font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .flow-line{
    width:2px; flex:1; background: var(--gray-200); margin: 4px 0 4px 14px;
    min-height:22px;
  }
  .flow-body{ padding-bottom: 18px; padding-top:2px; }
  .flow-body p{ margin:0; font-size:14.5px; color:var(--gray-800); line-height:1.5; font-weight:600; }

  footer{
    text-align:center; color: var(--gray-400); font-size:12px; padding: 20px 24px 40px;
  }

  .chiplist{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap:10px;
  }
  .chip{
    display:flex; align-items:flex-start; gap:10px;
    background: var(--gray-50); border:1px solid var(--gray-200);
    border-radius:10px; padding:11px 13px;
  }
  .chip .chip-badge{
    width:22px;height:22px;border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
    font-size:11px; line-height:1; font-weight:800; color:white; background: var(--brand-navy-2);
  }
  .chip-badge.check{ background: var(--orange-500); }
  .chip-badge svg{ width:12px;height:12px; stroke:white; }
  .chip .chip-label{ font-size:13.5px; line-height:1.45; color: var(--gray-800); }


  .hero-cta{ margin-top:16px; }

  .stats-row{
    display:flex; justify-content:center; gap:32px; margin-top:16px; flex-wrap:wrap;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:1px; min-width:64px; }
  .stat strong{ font-size:22px; color:var(--blue-900); font-weight:800; line-height:1.2; }
  .stat span{ font-size:11px; color:var(--gray-600); text-transform:uppercase; letter-spacing:.03em; font-weight:600; text-align:center; }

  /* ---------- Responsividade ---------- */
  @media (max-width:760px){
    .grid{ grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); }
    .grid.tight{ grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); }
  }

  @media (max-width:640px){
    .gov-id{ display:none; }
    .committee-chip{ padding:3px 8px; }
    .committee-chip .committee-logo{ height:17px; }
    .divider{ height:18px; }

    .topbar{ padding:12px 16px; gap:10px; }
    .topbar .sedec-logo{ height:40px; }
    .topbar-text .eyebrow{ font-size:10px; }
    .topbar-text h1{ font-size:13.5px; }
    .topbar-note{ font-size:9px; max-width:100%; }

    .breadcrumb{ padding:12px 16px 0; font-size:12px; }
    .backbar{ padding:0 16px; margin-top:8px; }
    main{ padding:16px 16px 48px; }

    .hero{ padding:16px 2px 4px; }
    .hero h2{ font-size:21px; }
    .hero p.sub{ font-size:14px; }
    .hero .seal{ padding:10px 18px; margin-bottom:12px; }
    .hero .seal img{ height:38px; }
    .hero-eyebrow{ font-size:11px; }
    .stats-row{ gap:20px; margin-top:12px; }
    .hero-cta{ margin-top:12px; }
    .stat strong{ font-size:19px; }
    .stat span{ font-size:10px; }

    .section-title{ font-size:18px; }
    .panel{ padding:16px 16px; }
    .card{ padding:16px; }
    .home-card{ padding:20px 16px; }
    .grid{ gap:12px; }
    .grid.tight{ gap:12px; }

    .chiplist{ grid-template-columns: 1fr; }
  }

  @media (max-width:380px){
    .hero h2{ font-size:20px; }
    .hero .seal img{ height:36px; }
    .stats-row{ gap:14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img class="sedec-logo" id="sedecLogo" alt="Defesa Civil — Governo do Estado do Rio de Janeiro">
    <div class="topbar-text">
      <div class="eyebrow">PLANCON Estadual · Componente Animal</div>
      <h1>Plano de Contingência para Animais — Resumo Prático</h1>
      <div class="topbar-note">Material em desenvolvimento (análises e ajustes em andamento). Fonte: Dra. Leniane Nogueira (GRETA) e SEDEC-RJ.</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="gov-id">
      Governo do Estado<span class="full">&nbsp;do Rio de Janeiro</span>
    </div>
    <span class="committee-chip">
      <img id="institLogo" class="committee-logo" alt="Comitê Estadual de Enfrentamento aos Efeitos do El Niño">
    </span>
    <span class="divider"></span>
    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar entre tela clara e escura" title="Alternar tema"></button>

let stack = ["home"];

function bullets(arr){ return `<ul class="bullets">${arr.map(t=>`<li>${t}</li>`).join('')}</ul>`; }

function chipList(items, opts={}){
  const numbered = !!opts.numbered;
  return `<div class="chiplist">${items.map((raw,i)=>{
    const label = raw.replace(/^\d+\.\s*/,'').replace(/[;.]\s*$/,'');
    const badge = numbered ? `<span class="chip-badge">${i+1}</span>` : `<span class="chip-badge check">${icon('check')}</span>`;
    return `<div class="chip">${badge}<span class="chip-label">${label}</span></div>`;
  }).join('')}</div>`;
}

/* ---------- Navegação ---------- */
function nav(id){
  stack.push(id);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goBack(){
  if(stack.length > 1){
    stack.pop();
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
function goTo(index){
  stack = stack.slice(0, index+1);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function render(){
  const current = stack[stack.length-1];
  document.getElementById('main').innerHTML = `<div class="screen active">${SCREENS[current].render()}</div>`;
  document.getElementById('backBtn').disabled = stack.length <= 1;
  document.body.classList.toggle('at-home', stack.length <= 1);
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = stack.map((id,i)=>{
    const last = i === stack.length-1;
    return `${i>0?'<span class="sep">/</span>':''}<span class="crumb ${last?'current':''}" ${last?'':`onclick="goTo(${i})"`}>${SCREENS[id].crumb}</span>`;
  }).join('');
}
render();
</script>
</body>
</html>
